<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scanner IC (Auto)</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  *{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0}
  header{padding:12px 16px;background:#1e293b;font-weight:600}header small{display:block;color:#94a3b8;font-weight:400}
  main{max-width:640px;margin:auto;padding:14px}
  .cam{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden}
  video{width:100%;height:100%;object-fit:cover}
  .guide{position:absolute;inset:18% 8%;border:3px dashed #f59e0b;border-radius:10px;pointer-events:none;transition:border-color .2s}
  .guide.ok{border:3px solid #22c55e}
  .guide span{position:absolute;top:-26px;left:0;font-size:12px;background:#f59e0b;color:#000;padding:2px 8px;border-radius:6px}
  .guide.ok span{background:#22c55e}
  .scanline{position:absolute;left:8%;right:8%;height:2px;background:#f59e0b;top:18%;animation:sl 1.6s linear infinite;opacity:.8}
  @keyframes sl{to{top:82%}}.paused .scanline{display:none}
  .btns{display:flex;gap:8px;margin:10px 0}
  button{flex:1;padding:13px;border:0;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
  .p{background:#22c55e;color:#000}.s{background:#334155;color:#e2e8f0}.a{background:#d97706;color:#fff}.b{background:#2563eb;color:#fff}
  button:disabled{opacity:.5}
  .card{background:#1e293b;border-radius:12px;padding:14px;margin-top:12px}
  .muted{color:#94a3b8;font-size:13px}
  label{display:block;font-size:13px;margin:10px 0 4px;color:#cbd5e1}
  input{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:16px}
  input.hit{border-color:#22c55e}
  #status{font-size:14px}
</style>
</head>
<body>
<header>📷 Scanner IC — Auto <small id="sesi"></small></header>
<main>
  <div class="cam paused" id="camBox">
    <video id="video" autoplay playsinline muted></video>
    <div class="guide" id="guide"><span>Letakkan IC dalam kotak</span></div>
    <div class="scanline"></div>
  </div>
  <div class="btns">
    <button class="p" id="btnStart">▶ Mula Imbas</button>
    <button class="s" id="btnSwitch" disabled>🔄 Tukar Kamera</button>
  </div>
  <div class="card"><div id="status" class="muted">Tekan "Mula Imbas". IC akan dikesan secara automatik.</div></div>

  <div class="card">
    <label>No. IC</label><input id="ic" inputmode="numeric" maxlength="14">
    <label>Nama Penuh</label><input id="nama">
    <div class="btns"><button class="s" id="btnRescan">↺ Imbas Semula</button></div>
  </div>

  <div class="card">
    <div class="muted">Semak SPR: No IC disalin → tampal di laman SPR → selesaikan CAPTCHA → isi DUN.</div>
    <div class="btns"><button class="a" id="btnSPR">🔎 Salin IC & Buka SPR</button></div>
    <label>DUN</label><input id="dun" placeholder="cth: N.xx Nama DUN">
    <label>Parlimen</label><input id="parlimen" placeholder="cth: P.xxx Nama Parlimen">
    <div class="btns"><button class="b" id="btnSend">📤 Hantar ke Sistem Key In</button></div>
  </div>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyZsCARpa2k6Y43Lq9r4UFtzk05q5II-bYcloru0awcwZX2R0Rp9XIvmex0LO8VmG2s/exec';
const SPR_URL = 'https://mysprsemak.spr.gov.my/semakan/daftarPemilih';
const session = new URLSearchParams(location.search).get('s');
const $ = id => document.getElementById(id);
const video=$('video');
let stream=null, facing='environment', worker=null, scanning=false, busy=false, lastIC='', hits=0, bestName='';
$('sesi').textContent = session ? 'Sesi: '+session : '⚠️ Tiada sesi — imbas QR dari sistem key in';

const status = t => $('status').textContent = t;
const fmt = d => d.length===12 ? `${d.slice(0,6)}-${d.slice(6,8)}-${d.slice(8)}` : d;
$('ic').addEventListener('input',e=>e.target.value=fmt(e.target.value.replace(/\D/g,'').slice(0,12)));

async function startCam(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:false});
    video.srcObject=stream; $('btnSwitch').disabled=false;
  }catch(e){ status('Gagal buka kamera: '+e.message+' (perlu HTTPS & izin kamera)'); throw e; }
}
async function getWorker(){
  if(!worker){ status('Memuatkan enjin OCR (kali pertama agak lama)...'); worker=await Tesseract.createWorker('eng'); }
  return worker;
}

// Potong ikut kotak panduan + grayscale + kontras
function grab(){
  const vw=video.videoWidth, vh=video.videoHeight, sw=vw*.84, sh=vh*.64, sc=Math.min(1,1400/sw);
  const c=document.createElement('canvas'); c.width=sw*sc; c.height=sh*sc;
  const x=c.getContext('2d'); x.drawImage(video,vw*.08,vh*.18,sw,sh,0,0,c.width,c.height);
  const im=x.getImageData(0,0,c.width,c.height), d=im.data;
  for(let i=0;i<d.length;i+=4){let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];g=(g-128)*1.6+128;g=g<0?0:g>255?255:g;d[i]=d[i+1]=d[i+2]=g;}
  x.putImageData(im,0,0); return c;
}

const fixDigits = s => s.replace(/[Oo]/g,'0').replace(/[Il|]/g,'1').replace(/S/g,'5').replace(/B/g,'8').replace(/Z/g,'2');
const validIC = ic => { const mm=+ic.slice(2,4), dd=+ic.slice(4,6); return mm>=1&&mm<=12&&dd>=1&&dd<=31; };
const BUANG=/KAD|PENGENALAN|MALAYSIA|MYKAD|IDENTITY|CARD|WARGANEGARA|LELAKI|PEREMPUAN|ISLAM|KERAJAAN/;

function parse(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const re=/(\d{6})\s*[-–—~.\s]?\s*(\d{2})\s*[-–—~.\s]?\s*(\d{4})/;
  let ic='', idx=-1;
  for(let i=0;i<lines.length&&!ic;i++){ const m=fixDigits(lines[i]).match(re); if(m&&validIC(m[1]+m[2]+m[3])){ic=m[1]+m[2]+m[3];idx=i;} }
  const nama=[];
  for(let i=idx+1;ic&&i<lines.length&&nama.length<3;i++){
    if(/\d/.test(lines[i])&&nama.length) break;          // sampai alamat
    const l=lines[i].replace(/[^A-Za-z@'\/\. ]/g,'').replace(/\s+/g,' ').trim();
    if(l.length>=3&&l===l.toUpperCase()&&/[A-Z]{2}/.test(l)&&!BUANG.test(l)) nama.push(l);
  }
  return {ic, nama:nama.join(' ')};
}

// Gelung auto-scan: IC sama dikesan 2 kali berturut → dianggap sah
async function loop(){
  if(!scanning) return;
  if(!busy && video.videoWidth){
    busy=true;
    try{
      const {data:{text}}=await (await getWorker()).recognize(grab());
      const r=parse(text);
      if(r.ic){
        if(r.nama.length>bestName.length) bestName=r.nama;
        hits = r.ic===lastIC ? hits+1 : 1; lastIC=r.ic;
        $('guide').classList.add('ok'); status(`IC dikesan (${hits}/2) — pegang stabil...`);
        if(hits>=2) return done(r.ic, bestName);
      }else{ $('guide').classList.remove('ok'); status('🔍 Mengimbas... halakan IC ke dalam kotak'); }
    }catch(e){ status('Ralat OCR: '+e.message); }
    busy=false;
  }
  setTimeout(loop,300);
}

function done(ic,nama){
  scanning=false; busy=false; $('camBox').classList.add('paused');
  $('ic').value=fmt(ic); $('nama').value=nama; ['ic','nama'].forEach(k=>$(k).value&&$(k).classList.add('hit'));
  if(navigator.vibrate) navigator.vibrate(150);
  status(nama?'✅ Berjaya! Semak nama, kemudian semak SPR.':'✅ IC dikesan. Nama tidak jelas — sila taip manual.');
  $('btnStart').textContent='▶ Mula Imbas'; $('btnStart').disabled=false;
}

async function start(){
  try{ if(!stream) await startCam(); }catch(e){ return; }
  await getWorker();
  lastIC=''; hits=0; bestName=''; scanning=true;
  $('camBox').classList.remove('paused'); $('guide').classList.remove('ok');
  $('btnStart').textContent='⏸ Mengimbas...'; $('btnStart').disabled=true;
  status('🔍 Mengimbas... halakan IC ke dalam kotak'); loop();
}

$('btnStart').onclick=start;
$('btnRescan').onclick=()=>{ ['ic','nama'].forEach(k=>{$(k).value='';$(k).classList.remove('hit')}); start(); };
$('btnSwitch').onclick=async()=>{ facing=facing==='environment'?'user':'environment'; await startCam(); };
$('btnSPR').onclick=async()=>{
  const ic=$('ic').value.replace(/\D/g,''); if(ic.length!==12) return alert('No IC mesti 12 digit');
  try{await navigator.clipboard.writeText(ic);}catch(e){} window.open(SPR_URL,'_blank');
};
$('btnSend').onclick=async()=>{
  if(!session) return alert('Tiada sesi. Imbas QR dari sistem key in.');
  const body={action:'pushScan',session,ic:$('ic').value,nama:$('nama').value.trim().toUpperCase(),dun:$('dun').value.trim(),parlimen:$('parlimen').value.trim()};
  if(body.ic.replace(/\D/g,'').length!==12||!body.nama) return alert('No IC & nama wajib');
  status('Menghantar...');
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(r=>r.json());
    status(r.ok?'✅ Dihantar! Semak skrin sistem key in.':'❌ '+r.error);
  }catch(e){ status('❌ Gagal hantar: '+e.message); }
};
// Auto mula kamera bila halaman dibuka dari QR
if(session) start();
</script>
</body>
</html>
